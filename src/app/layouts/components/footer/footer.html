<footer [ngClass]="{ 'footer-test': !isProdBuild }" class="footer text-end p-2 text-gray-500 text-sm">
  @if (versionInfo){
    <ng-container>
      Versión: {{ versionInfo.version }}
      @if (isProdBuild) {
        ({{ versionInfo.commitHash }})
      } @else {
        ({{ versionInfo.branch }} | {{ versionInfo.commitHash }})
      }
    </ng-container>
  }
</footer>
