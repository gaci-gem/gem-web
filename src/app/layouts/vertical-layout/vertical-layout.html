@if (layout.isLoading) {
<div class="loading-overlay">
  <div class="spinner-border text-primary" role="status">
    <span class="visually-hidden">Loading...</span>
  </div>
</div>
}

<div class="wrapper">
  @if (updateAvailable) {
    <div class="alert alert-warning alert-dismissible mb-0 rounded-0 text-center" role="alert">
      Hay una nueva versión disponible. Actualizá la aplicación para continuar con los últimos cambios.
      <button type="button" class="btn btn-warning btn-sm ms-2" (click)="reloadApplication()">
        Actualizar ahora
      </button>
    </div>
  }

  <app-topbar />

  <app-sidenav />

  <div class="content-page">
    <!-- Banner de evento en trabajo movido aquí -->
    <app-evento-cronometro></app-evento-cronometro>

    <app-greeting-banner />

    <router-outlet />

    <app-footer />
  </div>
</div>

<!-- Drawers globales -->
<app-drawer-container></app-drawer-container>
