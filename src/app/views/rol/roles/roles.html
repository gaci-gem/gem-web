<p-confirmDialog></p-confirmDialog>
<p-toast></p-toast>
<div class="container-fluid">
    <div class="row justify-content-center">
        <div class="col-12 mt-3">
            <app-ui-card title="Roles">
                <div card-body>
                    <p-toolbar styleClass="mb-2 gap-2">
                        <ng-template pTemplate="left">
                            <app-filtro-presets [presets]="presets()" [selectedPresetId]="selectedPresetId" (selectedPresetIdChange)="selectedPresetId = $event" (apply)="applyPreset($event)" (save)="savePreset($event.name)" (remove)="removePreset($event)" (setDefault)="setPresetDefault($event)" (clearFilters)="clear(dt)" />
                        </ng-template>
                        <ng-template pTemplate="right">
                            @if (can(PermisoAccion.CREAR)) {
                                <app-control-trabajar-con
                                    (nuevo)="mostrarModalCrud(null, 'A')"
                                    (plantilla)="getPlantilla()"
                                    (exportarExcel)="exportarExcel()"
                                    (importar)="importarExcel($event)">
                                ></app-control-trabajar-con>
                            }
                        </ng-template>
                    </p-toolbar>
                    <div class="app-filter-row d-flex align-items-center gap-3 mb-1 flex-wrap"><span class="p-input-icon-left"><i class="pi pi-search"></i><input pInputText type="text" [value]="globalFilter" (input)="onGlobalFilter(getEventValue($event))" placeholder="Buscar..." /></span><app-filtro-radio-group [options]="FiltroActivoOptions" [checkedValue]="filtroActivo" (filtroCambio)="filtroCambio($event)" [notLabel]="true"></app-filtro-radio-group></div>
                    <p-table
                        #dt
                        [value]="roles"
                        [lazy]="true"
                        [totalRecords]="totalRoles"
                        [rows]="10"
                        [rowsPerPageOptions]="[5, 10, 15, 25, 50]"
                        [paginator]="true"
                        [globalFilterFields]="['codigo', 'descripcion', 'activo']"
                        [tableStyle]="{ 'min-width': '75rem' }"
                        [rowHover]="true"
                        dataKey="id"
                        currentPageReportTemplate="Mostrando desde {first} a {last} de {totalRecords} registros"
                        [showCurrentPageReport]="true"
                        (onFilter)="onTableFilter($event)"
                        (onPage)="onTablePage($event)"
                        (onSort)="onTableSort($event)"
                        size="small"
                    >
                        <ng-template pTemplate="header">
                            <tr>
                                <!-- <th style="width: 4rem">
                                    <p-tableHeaderCheckbox></p-tableHeaderCheckbox>
                                </th> -->
                                <th pSortableColumn="codigo">Codigo <p-sortIcon field="codigo" ></p-sortIcon><p-columnFilter type="text" field="codigo" display="menu" matchMode="contains" style="margin-left: 2px;"></p-columnFilter></th>
                                <th pSortableColumn="descripcion">Descripcion <p-sortIcon field="descripcion"></p-sortIcon><p-columnFilter type="text" field="descripcion" display="menu" matchMode="contains" style="margin-left: 2px;"></p-columnFilter></th>
                                <th pSortableColumn="color">Color <p-sortIcon field="color"></p-sortIcon></th>
                                <th></th>
                            </tr>
                        </ng-template>
                        <ng-template pTemplate="body" let-rol>
                            <tr>
                                <!-- <td>
                                    <p-tableCheckbox [value]="rol"></p-tableCheckbox>
                                </td> -->
                                <td>{{ rol.codigo }}</td>
                                <td>{{ rol.descripcion }}</td>
                                <td>
                                    <!-- <app-badge-click
                                        [backgroundColor]="rol.color ?? primaryColor"
                                        width="2.5rem"
                                        height="inherit"
                                    > </app-badge-click> -->
                                    <span class="categoria-dot" [style.background]="rol.color" [style.display]="'inline-block'" [style.width.px]="20" [style.height.px]="20" [style.border-radius]="'4px'" [style.vertical-align]="'middle'" [style.margin-right]="'8px'"></span>
                                </td>
                                <td class="d-flex justify-content-end">
                                    @if (can(PermisoAccion.MODIFICAR)) {
                                        <button class="btn btn-ghost-warning" (click)="mostrarModalCrud(rol, 'M')"><ng-icon name="lucidePencil"/></button>
                                    }
                                    @if (can(PermisoAccion.ELIMINAR)) {
                                        <button class="btn btn-ghost-danger" (click)="delete(rol)" [disabled]="actionInProgress" [attr.aria-busy]="actionInProgress" [attr.title]="actionInProgress ? 'Eliminando...' : 'Eliminar'">@if (actionInProgress) { Eliminando... } @else { <ng-icon name="lucideTrash2"/> }</button>
                                    }
                                </td>
                            </tr>
                        </ng-template>
                        <ng-template pTemplate="summary">
                            <div class="flex align-items-center justify-content-between">En total hay {{ totalRoles }} Roles.</div>
                        </ng-template>
                    </p-table>

                </div>
            </app-ui-card>

        </div>
    </div>
</div>
