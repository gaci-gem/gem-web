<p-toast></p-toast>
<div class="container">
  <form class="row g-3 needs-validation" [formGroup]="form" (ngSubmit)="accion($event)" novalidate>
    <!-- Campos de TipoEvento -->
    <div class="col-md-1">
      <label for="codigo" class="form-label">Codigo</label>
      <input id="codigo" type="text" formControlName="codigo" class="form-control" placeholder="codigo" />
    </div>

    <div class="col-md-4">
      <label for="descripcion" class="form-label">Descripcion</label>
      <input id="descripcion" type="text" formControlName="descripcion" class="form-control" placeholder="descripcion" required />
    </div>

    <div class="col-md-1">
      <label for="color" class="form-label">Color</label>
      <input id="color" type="color" formControlName="color" class="form-control form-control-color" required />
    </div>
    <div class="col-md-6">

      <div class="row">

        <div class="col-md-4 p-0">
          <label for="activo" class="form-label">Activo</label>
          <div class="mb-2">
            <input id="activo" type="checkbox" formControlName="activo" class="btn-check" />
            <label class="btn btn-outline-primary" for="activo">
              @if (get('activo')?.value){
              ACTIVO
              } @else {
              DESACTIVO
              }
            </label>
          </div>
        </div>

        <div class="col-md-4 p-0">
          <label for="propio" class="form-label">Propio</label>
          <div class="mb-2">
            <input id="propio" type="checkbox" formControlName="propio" class="btn-check" />
            <label class="btn btn-outline-primary" for="propio">
              PROPIO
            </label>
          </div>
        </div>

        <div class="col-md-4 p-0">
          <label for="facturable" class="form-label">Facturable</label>
          <div class="mb-2">
            <input id="facturable" type="checkbox" formControlName="facturable" class="btn-check" />
            <label class="btn btn-outline-primary" for="facturable">
              @if (get('facturable')?.value){
              ACTIVO
              } @else {
              DESACTIVO
              }
            </label>
          </div>
        </div>

        <div class="col-md-4 p-0">
          <label for="facturableAuto" class="form-label">Horas Facturables Automaticas</label>
          <div class="mb-2">
            <input id="facturableAuto" type="checkbox" formControlName="facturableAuto" class="btn-check" />
            <label class="btn btn-outline-primary" for="facturableAuto">
              @if (get('facturableAuto')?.value){
              ACTIVO
              } @else {
              DESACTIVO
              }
            </label>
          </div>
        </div>

      </div>
    </div>

    @if (!(get('propio')?.value)) {
      <!-- Sección de etapas -->
      <div class="col-12 stages-section">
        <div class="stages-section-heading">
          <div>
            <h5>Etapas</h5>
            <p>Definí la secuencia y los hitos automáticos de cada etapa.</p>
          </div>
        </div>
        <div formArrayName="etapas">
          <div class="stage-grid stage-grid-header" aria-hidden="true">
            <span>Etapa</span>
            <span>Secuencia</span>
            <span>
              Hitos automáticos
              <span class="milestone-help" title="Inicio registra cuándo comienza el trabajo. Fin registra cuándo termina el trabajo." aria-label="Inicio registra cuándo comienza el trabajo. Fin registra cuándo termina el trabajo.">?</span>
            </span>
            <span>Rollback</span>
            <span>Acción</span>
          </div>
          @for (etapa of etapasFormArray.controls; track etapa) {
            <div [formGroupName]="$index" class="stage-grid stage-row">
              <div class="stage-field">
                <label for="etapa-{{$index}}">Etapa</label>
                <select id="etapa-{{$index}}" class="form-control" formControlName="etapaId">
                  <option [ngValue]="null">-- Seleccionar --</option>
                  @for (e of etapasCatalogo; track e.id) {
                    <!-- ngValue preserva el tipo (number si e.id es number) -->
                    <option [ngValue]="e.id">{{ e.nombre }}</option>
                  }
                </select>
              </div>

              <div class="stage-field stage-sequence">
                <label for="secuencia-{{$index}}">Secuencia</label>
                <input id="secuencia-{{$index}}" type="number" class="form-control" formControlName="etapaSecuencia" readonly />
              </div>

              <fieldset class="stage-field stage-milestones">
                <legend>Hitos automáticos</legend>
                <label class="milestone-option">
                  <input type="checkbox" class="form-check-input" formControlName="marcaInicio" />
                  Inicio
                </label>
                <label class="milestone-option">
                  <input type="checkbox" class="form-check-input" formControlName="marcaFin" />
                  Fin
                </label>
              </fieldset>

              <div class="stage-field">
                <label for="rollback-{{$index}}">Rollback</label>
                <select id="rollback-{{$index}}" class="form-control" formControlName="rollbackSec">
                  <option [ngValue]="null">-- Ninguno --</option>
                  @for (seq of getRollbackOptions(etapa.get('etapaSecuencia')?.value); track seq) {
                    <option [ngValue]="seq">Secuencia {{ seq }}</option>
                  }
                  @for (eAr of etapasArchivo; track eAr) {
                    <option [ngValue]="eAr.id != null ? -eAr.id : null">Archivar en {{ eAr.nombre }}</option>
                  }
                </select>
              </div>

              <div class="stage-action">
                <button type="button" class="btn btn-outline-danger btn-sm" (click)="removeEtapaByControl(etapa)" title="Eliminar etapa" aria-label="Eliminar etapa">Eliminar</button>
              </div>
            </div>
          }
        </div>
        <button type="button" class="btn btn-success btn-sm add-stage-button" (click)="addEtapa()">Agregar etapa</button>
        
        <!-- Selector de etapa final (solo etapas de archivo) -->
        <div class="final-stage-panel">
          <label for="etapaFinal" class="form-label">Etapa al finalizar</label>
          <select id="etapaFinal" class="form-control" formControlName="etapaFinal">
            <option [ngValue]="null">-- Seleccionar etapa final --</option>
            @for (eAr of etapasArchivo; track eAr.id) {
              <option [ngValue]="eAr.id">{{ eAr.nombre }}</option>
            }
          </select>
        </div>
      </div>
    } @else {
      <div class="col-12 final-stage-panel standalone-final-stage">
        <label for="etapaFinal" class="form-label">Etapa a almacenar</label>
          <select id="etapaFinal" class="form-control" formControlName="etapaFinal">
          <option [ngValue]="null">-- Seleccionar etapa a almacenar --</option>
          @for (eAr of etapasArchivo; track eAr.id) {
            <option [ngValue]="eAr.id">{{ eAr.nombre }}</option>
          }
          </select>
       </div>
    }
    




    <div class="col-12 mb-5">
      <button class="btn btn-primary" type="submit" [disabled]="form.invalid || submitting" [attr.aria-busy]="submitting">
        @if (submitting) { Guardando... } @else if (modo === 'A') { Crear } @else if (modo === 'M') { Modificar }
      </button>
      <button class="btn btn-outline-secondary" type="button" (click)="cancel()">Cancelar</button>
    </div>
  </form>
</div>
