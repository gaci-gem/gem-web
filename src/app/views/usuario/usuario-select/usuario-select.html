@if (loadingSelect) { <app-loading-spinner /> }
<p-table #dt [value]="usuarios" [rows]="10" [paginator]="true" [globalFilterFields]="['nombre','apellido','usuario','email']">
  <ng-template pTemplate="caption">
    <input pInputText type="text" (input)="dt.filterGlobal(getEventValue($event), 'contains')" placeholder="Buscar usuario..." />
  </ng-template>
  <ng-template pTemplate="header">
    <tr><th></th><th>Nombre</th><th>Apellido</th><th>Usuario</th><th>Email</th></tr>
  </ng-template>
  <ng-template pTemplate="body" let-usuario>
    <tr>
      <td><button class="btn btn-ghost-warning" (click)="select(usuario)" aria-label="Seleccionar usuario"><ng-icon name="lucideSearchCheck" /></button></td>
      <td>{{ usuario.nombre || '-' }}</td>
      <td>{{ usuario.apellido || '-' }}</td>
      <td><app-badge-click [backgroundColor]="usuario.color" (click)="openUser(usuario.id!, $event)">{{ usuario.usuario }}</app-badge-click></td>
      <td>{{ usuario.email }}</td>
    </tr>
  </ng-template>
  <ng-template pTemplate="summary">En total hay {{ usuarios.length }} usuarios activos.</ng-template>
</p-table>
