<p-confirmdialog></p-confirmdialog>
<p-toast></p-toast>
<div class="container-fluid">
    <div class="row justify-content-center">
        <div class="col-12 mt-3">
            <app-ui-card title="Modulos">
                <div card-body>
                    <p-toolbar styleClass="mb-2 gap-2">
                        <ng-template #start>
                            <app-filtro-presets [presets]="presets()" [selectedPresetId]="selectedPresetId" (selectedPresetIdChange)="selectedPresetId = $event" (apply)="applyPreset($event)" (save)="savePreset($event.name)" (remove)="removePreset($event)" (setDefault)="setPresetDefault($event)" (clearFilters)="clear(dt)" />
                        </ng-template>
                        <ng-template #end>
                            @if (can(PermisoAccion.CREAR)) {
                                <app-control-trabajar-con
                                    (nuevo)="mostrarModalCrud(null, 'A')"
                                    (plantilla)="getPlantilla()"
                                    (exportarExcel)="exportarExcel()"
                                    (importar)="importarExcel($event)">
                                ></app-control-trabajar-con>
                            }
                        </ng-template>
                    </p-toolbar>
                    <div class="app-filter-row d-flex align-items-center gap-3 mb-1 mt-1 flex-wrap"><span class="p-input-icon-left"><i class="pi pi-search"></i><input pInputText type="text" [value]="globalFilter" (input)="onGlobalFilter(getEventValue($event))" placeholder="Buscar..." /></span><app-filtro-radio-group [options]="FiltroActivoOptions" [checkedValue]="filtroActivo" (filtroCambio)="filtroCambio($event)" [notLabel]="true"></app-filtro-radio-group></div>
                    <p-table
                        #dt
                        [value]="modulos"
                        [lazy]="true"
                        [totalRecords]="totalModulos"
                        [rows]="10"
                        [rowsPerPageOptions]="[5, 10, 15, 25, 50]"
                        [paginator]="true"
                        [globalFilterFields]="['codigo', 'nombre', 'padreCodigo', 'activo']"
                        [tableStyle]="{ 'min-width': '75rem' }"
                        [rowHover]="true"
                        dataKey="id"
                        currentPageReportTemplate="Mostrando desde {first} a {last} de {totalRecords} registros"
                        [showCurrentPageReport]="true"
                        (onFilter)="onTableFilter($event)"
                        (onPage)="onTablePage($event)"
                        (onSort)="onTableSort($event)"
                        size="small"
                    >
                        <ng-template #header>
                            <tr>
                                <!-- <th style="width: 4rem">
                                    <p-tableheadercheckbox></p-tableheadercheckbox>
                                </th> -->
                                <th pSortableColumn="codigo">Codigo <p-sorticon field="codigo" ></p-sorticon><p-columnfilter type="text" field="codigo" display="menu" matchMode="contains" style="margin-left: 2px;"></p-columnfilter></th>
                                <th pSortableColumn="nombre">Nombre <p-sorticon field="nombre"></p-sorticon><p-columnfilter type="text" field="nombre" display="menu" matchMode="contains" style="margin-left: 2px;"></p-columnfilter></th>
                                <th pSortableColumn="padreCodigo">Padre <p-sorticon field="padreCodigo"></p-sorticon></th>
                                <th pSortableColumn="activo">Activo <p-sorticon field="activo"></p-sorticon></th>
                                <th></th>
                            </tr>
                        </ng-template>
                        <ng-template #body let-modulo>
                            <tr>
                                <!-- <td>
                                    <p-tablecheckbox [value]="modulo"></p-tablecheckbox>
                                </td> -->
                                <td>{{ modulo.codigo }}</td>
                                <td>{{ modulo.nombre }}</td>
                                <td>{{ modulo.padreCodigo }}</td>
                                <td><span class="badge " style="min-width: 40%;" [ngClass]="modulo.activo ? 'text-bg-success' : 'text-bg-danger'">{{ modulo.activo | booleanLabel }}</span></td>
                                <td><div class="d-flex justify-content-end">
                                    @if (can(PermisoAccion.MODIFICAR)) {
                                        <button class="btn btn-ghost-warning" (click)="mostrarModalCrud(modulo, 'M')"><ng-icon name="lucidePencil"/></button>
                                    }
                                    @if (can(PermisoAccion.ELIMINAR)) {
                                        <button class="btn btn-ghost-danger" (click)="delete(modulo)" [disabled]="actionInProgress" [attr.aria-busy]="actionInProgress" [attr.title]="actionInProgress ? 'Eliminando...' : 'Eliminar'">@if (actionInProgress) { Eliminando... } @else { <ng-icon name="lucideTrash2"/> }</button>
                                    }
                                </div></td>
                            </tr>
                        </ng-template>
                        <ng-template #summary>
                            <div class="flex align-items-center justify-content-between">En total hay {{ totalModulos }} Modulos.</div>
                        </ng-template>
                    </p-table>

                </div>
            </app-ui-card>

        </div>
    </div>
</div>
