<div class="card">
    <p-fileUpload
        name="archivos"
        [url]="url"
        [multiple]="true"
        mode="advanced"
        (onUpload)="onUpload($event)"
        (onBeforeUpload)="onBeforeSend($event)"

        chooseLabel="Seleccionar"
        uploadLabel="Subir"
        cancelLabel="Cancelar"
    >
        <ng-template pTemplate="content" let-files let-removeFileCallback="removeFileCallback">
            @if (files?.length) {
                <div class="file-list">
                    @for (file of files; track file.name + file.size; let i = $index) {
                        <div class="file-row">
                            @if (file.type?.startsWith('image/') && file.objectURL) {
                                <img [src]="file.objectURL" [alt]="file.name" class="file-preview" />
                            } @else {
                                <i class="pi pi-file file-type-icon" aria-hidden="true"></i>
                            }
                            <span class="file-name" [title]="file.name">{{ file.name }}</span>
                            <button
                                type="button"
                                class="file-remove"
                                aria-label="Quitar archivo"
                                title="Quitar archivo"
                                (click)="removeFileCallback($event, file, i)">
                                <i class="pi pi-times" aria-hidden="true"></i>
                            </button>
                        </div>
                    }
                </div>
            }
        </ng-template>
        <ng-template pTemplate="empty">
            <div>Arrastrar y soltar archivos aquí para subir.</div>
        </ng-template>
    </p-fileUpload>
</div>
